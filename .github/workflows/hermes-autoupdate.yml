# Keeps HERMES_REF in the Dockerfile pinned to the newest upstream release.
#
# Runs daily (and on demand). If NousResearch/hermes-agent has published a
# newer release tag than the one pinned, this bumps the pin and commits
# straight to main. Railway watches main, so the commit triggers a rebuild
# and deploy automatically. No human approval in the loop — by design.
#
# To pause auto-updates: disable this workflow in the Actions tab, or set the
# repository variable HERMES_AUTOUPDATE=off.
# To roll back a bad upgrade: revert the "chore: bump Hermes" commit and push.
name: Hermes auto-update

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: ${{ vars.HERMES_AUTOUPDATE != 'off' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned vs latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^ARG HERMES_REF=\(.*\)$/\1/p' Dockerfile)
          latest=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "Pinned: $current  Latest: $latest"
          if [ -z "$latest" ] || [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump pin and push to main
        if: steps.check.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          sed -i "s|^ARG HERMES_REF=.*$|ARG HERMES_REF=${LATEST}|" Dockerfile
          git config user.name  "hermes-autoupdate[bot]"
          git config user.email "hermes-autoupdate@users.noreply.github.com"
          git add Dockerfile
          git commit             -m "chore: bump Hermes ${CURRENT} -> ${LATEST}"             -m "Automated by .github/workflows/hermes-autoupdate.yml."             -m "Release notes: https://github.com/NousResearch/hermes-agent/releases/tag/${LATEST}"
          git push origin HEAD:main
